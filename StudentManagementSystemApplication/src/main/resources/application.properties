# ─── APPLICATION ───────────────────────────────────────
spring.application.name=student-management-system
server.port=${PORT:8080}

# ─── DATABASE ──────────────────────────────────────────
# On Render: set DATABASE_URL (PostgreSQL) env var.
# Locally: uses MySQL on localhost.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/student_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root@123}

# Driver is chosen automatically by Spring Boot from the JDBC URL scheme
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MySQL8Dialect}

# ─── JPA / HIBERNATE ───────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ─── JACKSON ───────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC