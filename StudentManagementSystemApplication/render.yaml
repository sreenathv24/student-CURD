databases:
  - name: student-db
    plan: free
    databaseName: student_db
    user: student_user

services:
  - type: web
    name: student-management-api
    runtime: java
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/StudentManagementSystemApplication-1.0.0.jar
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: student-db
          property: connectionString
      - key: DB_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
    healthCheckPath: /api/students
